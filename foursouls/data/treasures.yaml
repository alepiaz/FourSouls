# ── Passives ──────────────────────────────────────────────────────────────────

DRY_BABY:
  name: "Dry Baby"
  on_enters_play:
    type: set_damage_cap
    amount: 1

"MEAT!":
  name: "Meat!"
  on_enters_play:
    type: increase_attack_bonus
    amount: 1

# ── Active items ──────────────────────────────────────────────────────────────

MAMA_MEGA:
  name: "Mama Mega"
  is_one_use: true   # item destroys itself when effect resolves
  tap_effect_description: "Destroy this. Deal 3 damage to each monster and player."
  tap_effect:
    type: aoe_damage
    amount: 3

YUM_HEART:
  name: "Yum Heart"
  eternal: true
  recharge_on: end_of_turn
  tap_target_type: player_or_monster
  tap_effect_description: "Choose a player or monster. Prevent the next 1 damage they would take this turn."
  tap_effect:
    type: prevent_damage_to_target
    amount: 1

