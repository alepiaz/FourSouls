  name: "The D6"
  eternal: true
  recharge_on: end_of_turn
  tap_effect_description: "Choose a dice roll. Its controller rerolls it. (Stub — Sprint 16)"

LUCKY_FOOT:
  name: "Lucky Foot"
  tap_effect_description: "Add up to 2 to a non-attack roll. (Stub — Sprint 16)"

SLEIGHT_OF_HAND:
