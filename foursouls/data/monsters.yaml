  base_hp: 2
  evade: 3
  attack: 1
  reward_loot: 1
  abilities:
    - ability_id: bony_attack_bonus
      kind: triggered
      trigger: {type: event, event_type: CombatRollResult}
      conditions:
        - {type: source_in_zone, zone: monster_slot}
        - {type: roll_equals, value: 1}
      targets:
        - {type: source}
      effects:
        - type: modify_source_stats
          attack_delta: 2
          duration: end_of_turn

# R13.7 — Base Game V2: https://foursouls.com/cards/b2-mega_fatty/
MEGA_FATTY:
  base_hp: 3
  evade: 3
  attack: 1
  has_soul: true
  is_boss: true
  reward_loot: 2
  abilities:
    - ability_id: mega_fatty_heal
      kind: triggered
      trigger: {type: event, event_type: DamageDealt}
      conditions:
        - {type: source_in_zone, zone: monster_slot}
        - {type: event_source_is_ability_source}
