CARRION_QUEEN:
  base_hp: 3
  evade: 4
  attack: 1
  has_soul: true
  reward_treasure: 1
  is_boss: true
  abilities:
    - ability_id: carrion_queen_prevent_combat_damage
      kind: replacement
      trigger: {type: event, event_type: DamageWouldBeDealt}
      conditions:
        - {type: source_in_zone, zone: monster_slot}
        - {type: event_target_is_ability_source}
        - {type: roll_in, values: [4, 5]}
      effects:
        - {type: prevent_event}

# ── Bosses ───────────────────────────────────────────────────────────────────

MONSTRO:
  base_hp: 4
  evade: 4
  attack: 1
  reward_coin: 6
  has_soul: true
  is_boss: true

HEADLESS_HORSEMAN:
  base_hp: 3
  evade: 3
  attack: 2
  has_soul: true
  reward_treasure: 1
  is_boss: true
  abilities:
    - ability_id: headless_horseman_prevent_death
      kind: replacement
      trigger: {type: event, event_type: MonsterDeathWouldOccur}
      conditions:
        - {type: source_in_zone, zone: monster_slot}
        - {type: event_target_is_ability_source}
      targets:
        - {type: source}
      effects:
        - {type: prevent_event}
        - {type: heal_source, amount: 2}
        - type: modify_source_stats
          attack_delta: -1
          evade_delta: 1
          duration: end_of_turn
      usage_limit: {max_uses: 1, reset: each_turn}

# ── Events ───────────────────────────────────────────────────────────────────

CURSED_CHEST:
  is_event: true
  event_effect:
    type: roll_branches
    branches:
      1: {type: deal_damage, amount: 1}
      2: {type: deal_damage, amount: 1}
      3: {type: deal_damage, amount: 1}
      4: {type: deal_damage, amount: 2}
      5: {type: deal_damage, amount: 2}

WE_NEED_TO_GO_DEEPER:
  is_event: true
  event_effect:
    type: reset_attack


# R13.6 — Four Souls+ V2: https://foursouls.com/cards/fsp2-bony/
